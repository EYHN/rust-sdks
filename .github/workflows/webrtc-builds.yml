name: WebRTC builds
on:
  push:
    tags:
      - "webrtc-*"
  workflow_dispatch:
    inputs:
      release_tag:
        # SimKit fork: Actions artifacts expire, so anything SimKit pins must
        # come from a release. Name a new tag, e.g.
        # simkit-webrtc-<WEBRTC_TAG suffix>-<short sha>; empty builds only.
        description: "Publish the archives to this release tag (empty: build only)"
        type: string
        default: ""

jobs:
  build:
    # SimKit fork: only the mac-arm64 target is built (the daemon's only
    # deployment platform); the full upstream matrix is trimmed to save CI.
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: mac
            os: macos-latest
            cmd: ./build_macos.sh
            arch: arm64
        profile:
          - release

    name: Build webrtc (${{ matrix.target.name }}-${{ matrix.target.arch }}-${{ matrix.profile }}) ${{ matrix.target.buildargs }}
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Setup variables
        id: setup
        run: |
          DEFAULT_OUT=${{ matrix.target.name }}-${{ matrix.target.arch }}
          OUT=${{ matrix.target.out == '' && '$DEFAULT_OUT' || matrix.target.out }}-${{ matrix.profile }}
          echo OUT=$OUT >> $GITHUB_OUTPUT
          echo ZIP=webrtc-$OUT.zip >> $GITHUB_OUTPUT
        shell: bash

      # Print some debug infos to be sure everything is ok before doing really long tasks..
      - name: Info
        run: |
          echo "OutName: ${{ steps.setup.outputs.OUT }}"
          echo "OutZip: ${{ steps.setup.outputs.ZIP }}"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0

      - name: install setuptools (none-macOS)
        if: ${{ matrix.target.os != 'macos-latest' }}
        run: |
          pip3 install setuptools # pkg_resources is sometimes not found?

      - name: Install linux dependencies
        if: ${{ matrix.target.os == 'ubuntu-latest' }}
        run: |
          sudo apt update -y
          sudo apt install -y ninja-build pkg-config openjdk-11-jdk

      - name: Select Xcode 26.0
        if: ${{ matrix.target.os == 'macos-latest' }}
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer

      - name: Install macos dependencies
        if: ${{ matrix.target.os == 'macos-latest' }}
        run: brew install ninja

      - name: Install windows dependencies
        if: ${{ matrix.target.os == 'windows-2022' }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip" -OutFile ninja.zip
          Expand-Archive -Path ninja.zip -DestinationPath ${{ github.workspace }}\ninja
          echo "${{ github.workspace }}\ninja" | Out-File -Append -Encoding utf8 -FilePath $Env:GITHUB_PATH

      - name: Print ninja version
        run: ninja --version

      - name: Target OS
        run: echo -e "\ntarget_os = [\"${{ matrix.target.name }}\"]" >> .gclient
        shell: bash
        working-directory: webrtc-sys/libwebrtc

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        if: ${{ matrix.target.os == 'ubuntu-latest' }}
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build WebRTC
        run: ${{ matrix.target.cmd }} --arch ${{ matrix.target.arch }} --profile ${{ matrix.profile }} ${{ matrix.target.buildargs }}
        working-directory: webrtc-sys/libwebrtc

      - name: Zip artifact (Unix)
        if: ${{ matrix.target.os != 'windows-2022' }}
        run: |
          cd webrtc-sys/libwebrtc
          zip ${{ github.workspace }}/${{ steps.setup.outputs.ZIP }} ${{ steps.setup.outputs.OUT }} -r

      - name: Zip artifact (Windows)
        if: ${{ matrix.target.os == 'windows-2022' }}
        run: Compress-Archive -Path .\webrtc-sys\libwebrtc\${{ steps.setup.outputs.OUT }} -DestinationPath ${{ steps.setup.outputs.ZIP }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webrtc-builds-${{ steps.setup.outputs.OUT }}
          path: ${{ steps.setup.outputs.ZIP }}

  release:
    # SimKit fork: publishes each artifact's wrapper ZIP exactly as GitHub's
    # artifact API serves it — the file SimKit's WebRTCArtifact.lock.json
    # pins by sha256 — plus SHA256SUMS, onto a release that never expires.
    # The release is created when it does not exist yet.
    name: Release to GH
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      actions: read
    if: startsWith(github.ref, 'refs/tags/webrtc-') || inputs.release_tag != ''
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Download the wrapper ZIPs
        run: |
          set -euo pipefail
          mkdir webrtc-builds && cd webrtc-builds
          gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("webrtc-builds-")) | "\(.id) \(.name)"' > ../artifacts.txt
          test -s ../artifacts.txt
          while read -r id name; do
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GH_REPO/actions/artifacts/$id/zip" > "$name.github-artifact.zip"
          done < ../artifacts.txt
          sha256sum *.github-artifact.zip > SHA256SUMS
          cat ../artifacts.txt SHA256SUMS

      - name: Publish
        run: |
          set -euo pipefail
          cd webrtc-builds
          {
            echo "Prebuilt libwebrtc from run $GITHUB_RUN_ID, built from $GITHUB_SHA."
            echo
            echo "Each file is an Actions artifact's wrapper ZIP (artifact ID, name):"
            echo
            sed 's/^/- /' ../artifacts.txt
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" *.github-artifact.zip SHA256SUMS
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --notes-file ../notes.md *.github-artifact.zip SHA256SUMS
          fi
